name: Assets (map lines, stop pins, photos)

# Runs the jobs that need the internet and commits what they make back to the branch.
on:
  push:
    paths:
      - "data/photos.json"
      - "data/routes/*.json"
      - "data/stops-*.json"
      - "scripts/assets/**"
      - ".github/workflows/assets.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # to start the Publish workflow after committing (bot pushes don't trigger workflows)

concurrency:
  group: assets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Trace roads, pin stops, fetch and prepare photos
        run: node scripts/assets/run.mjs
      - name: Commit results
        run: |
          git config user.name "gala-assets-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data docs site
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "assets: map lines, stop pins and photos"
          # someone may have pushed while this ran: rebase onto the branch tip and retry
          for i in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push && break
            echo "push attempt $i failed; retrying"; sleep 5
          done
      - name: Build and publish with the new assets
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref "$GITHUB_REF_NAME"
