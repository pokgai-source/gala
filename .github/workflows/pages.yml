name: Publish site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 0 1 * *" # monthly rebuild so "Needs re-check" flags stay current

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install tools
        run: npm ci
      - name: Install Chromium for PDF, screenshots and design checks
        run: npx playwright install --with-deps chromium

      - name: Trace real road lines for maps (only where missing)
        continue-on-error: true
        run: |
          for f in data/routes/*.json; do
            case "$f" in *.geo.json) continue;; esac
            id=$(basename "$f" .json)
            [ -f "data/routes/$id.geo.json" ] || node scripts/trace-route.mjs "$id"
          done

      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log || {
            # surface failures as annotations (readable from the API and the PR page)
            grep -E -A25 "^not ok" test.log | grep -vE "^\s*(at |duration_ms|type:|code:|failureType|stack|\.\.\.|---)" | head -60 | while IFS= read -r l; do echo "::error title=npm test::$l"; done
            exit 1
          }

      - name: Build site, PDF, screenshots and design checks
        run: node scripts/build.mjs

      - name: Check links inside the site (must pass)
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --include-fragments '_site/**/index.html'
          fail: true

      - name: Check source and Maps links (report only)
        uses: lycheeverse/lychee-action@v2
        continue-on-error: true
        with:
          args: --no-progress --max-retries 2 --timeout 20 --accept '200..=299,403,429' --exclude 'google\.com/maps' 'data/*.json' '_site/**/index.html'
          fail: false

      - name: Upload screenshots and PDFs for review
        uses: actions/upload-artifact@v4
        with:
          name: roadbook-check
          path: |
            _site/**/check/*.png
            _site/**/*.pdf

      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
