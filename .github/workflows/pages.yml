name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 0 1 * *" # monthly rebuild so "Needs re-check" flags stay current

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate data and build _site/
        run: node scripts/build.mjs

      - name: Check links inside the site (must pass)
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --include-fragments '_site/**/*.html'
          fail: true

      - name: Check source and Maps links (report only)
        uses: lycheeverse/lychee-action@v2
        continue-on-error: true
        with:
          args: --no-progress --max-retries 2 --timeout 20 --accept '200..=299,403,429' --exclude 'google\.com/maps' 'data/*.json' '_site/**/*.html'
          fail: false

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
