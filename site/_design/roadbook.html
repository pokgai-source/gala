  <div class="duo">

      <div class="sec-head"><svg aria-hidden="true"><use href="#head-city"/></svg><span class="tape"></span><span class="ghost" aria-hidden="true">02</span><h2 id="p2">In <span id="p2-place">town</span></h2></div>
      <div class="sec-body" id="city"></div>
    </section>
    <section class="sec" aria-labelledby="p3">
      <div class="sec-head sky"><svg aria-hidden="true"><use href="#head-weather"/></svg><span class="tape"></span><span class="ghost" aria-hidden="true">03</span><h2 id="p3">Before you go</h2></div>
      <div class="sec-body" id="before"></div>
    </section>
  </div>
